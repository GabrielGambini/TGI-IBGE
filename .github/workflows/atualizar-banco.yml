name: Atualizar banco de dados do IBGE

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atualizar-banco:
    runs-on: ubuntu-latest
    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST || 'gateway01.sa-east-1.prod.aws.tidbcloud.com' }}
      DB_PORT: ${{ secrets.DB_PORT || '4000' }}
      DB_NAME: ${{ secrets.DB_NAME || 'tgi_ibge' }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Atualizar dados
        run: python Banco_de_Dados.py
