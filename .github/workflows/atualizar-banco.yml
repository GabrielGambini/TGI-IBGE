name: Atualizar banco de dados do IBGE

on:
  schedule:
    - cron: "0 12 15 * *"   # dia 15, 12:00 UTC (09:00 em Brasília)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atualizar-banco
  cancel-in-progress: false

jobs:
  atualizar-banco:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST || 'gateway01.sa-east-1.prod.aws.tidbcloud.com' }}
      DB_PORT: ${{ secrets.DB_PORT || '4000' }}
      DB_NAME: ${{ secrets.DB_NAME || 'tgi_ibge' }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Atualizar dados
        run: python -u Banco_de_Dados.py